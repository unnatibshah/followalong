# Ruff (REG-01): `ruff check .` and `ruff format --check server` from app/. The code style is 120-column lines.
line-length = 120
target-version = "py312"
extend-exclude = ["data", "eval"]

[lint]
# Ruff's default rules (pyflakes and the pycodestyle errors). Long lines are left to the reviewer: dense one-liners
# with a comment are the house style.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Playwright test tooling: short scripted sequences, one browser action per line or several with `;`.
"tests/e2e/*" = ["E401", "E702", "E731"]
